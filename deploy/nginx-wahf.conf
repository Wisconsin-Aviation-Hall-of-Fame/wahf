server {
    listen 80;
    listen [::]:80;
    server_name wahf.org www.wahf.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.wahf.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wahf.org;

    ssl_certificate /etc/letsencrypt/live/wahf.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wahf.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.wahf.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.wahf.org;

    ssl_certificate /etc/letsencrypt/live/wahf.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wahf.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    access_log /var/log/nginx/wahf.org.access.log;
    error_log /var/log/nginx/wahf.org.error.log;

    location /static/ {
        alias /home/wahf/wahf.org/static-collected/;
    }

    location /media/ {
        alias /home/wahf/wahf.org/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
